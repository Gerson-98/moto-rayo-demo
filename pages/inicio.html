<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Inicio - Moto Rayo</title>

  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#1b1e23" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Moto Rayo" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />

  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header app-header--inicio">
      <div class="app-header__izquierda">
        <img src="../icons/logo.svg" alt="Moto Rayo" class="logo-imagen--header" />
        <h1 class="app-header__titulo">Moto Rayo</h1>
      </div>

      <div class="app-header__derecha">
        <span class="app-header__usuario" id="nombre-usuario-activo"></span>
        <button class="boton-salir" id="boton-salir">Salir</button>
      </div>
    </header>

    <main class="app-main">
      <div class="app-main__header">
        <h2>¿Qué quieres hacer?</h2>
      </div>

      <div class="inicio-grid">
        <a href="venta.html" class="inicio-boton inicio-boton--vender">
          <span class="inicio-boton__icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M3 4h2.5l2.2 11h10.6l2-8H6.5"/></svg></span>
          <span class="inicio-boton__texto">Vender</span>
        </a>
        <a href="caja.html" class="inicio-boton inicio-boton--caja">
          <span class="inicio-boton__icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="1.5"/><circle cx="12" cy="12" r="2.4"/><path d="M6.5 10v4M17.5 10v4"/></svg></span>
          <span class="inicio-boton__texto">Caja</span>
        </a>
        <a href="productos.html" class="inicio-boton inicio-boton--productos">
          <span class="inicio-boton__icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></span>
          <span class="inicio-boton__texto">Productos</span>
        </a>
        <a href="clientes.html" class="inicio-boton inicio-boton--clientes">
          <span class="inicio-boton__icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg></span>
          <span class="inicio-boton__texto">Clientes</span>
        </a>
        <a href="reportes.html" class="inicio-boton inicio-boton--reportes oculto" id="boton-inicio-reportes">
          <span class="inicio-boton__icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M11 20V4M17 20v-6M3 20h18"/></svg></span>
          <span class="inicio-boton__texto">Reportes</span>
        </a>
        <a href="respaldo.html" class="inicio-boton inicio-boton--respaldo oculto" id="boton-inicio-respaldo">
          <span class="inicio-boton__icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.6-7.95A5.6 5.6 0 0 1 17 8.6 4.1 4.1 0 0 1 17.4 18H7z"/><path d="M12 11.5v6M12 11.5l-2 2M12 11.5l2 2"/></svg></span>
          <span class="inicio-boton__texto">Respaldo</span>
        </a>
        <a href="usuarios.html" class="inicio-boton inicio-boton--usuarios oculto" id="boton-inicio-usuarios">
          <span class="inicio-boton__icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.3"/><path d="M17 14c2.5 0 4.5 2 4.5 4.5"/></svg></span>
          <span class="inicio-boton__texto">Usuarios</span>
        </a>
      </div>

      <div class="resumen-hoy-inicio">
        <div class="resumen-hoy-inicio__item">
          <span class="resumen-hoy-inicio__etiqueta">Estado de caja</span>
          <span class="resumen-hoy-inicio__valor" id="resumen-estado-caja">Cargando...</span>
        </div>
        <div class="resumen-hoy-inicio__item" id="resumen-ventas-hoy-wrap">
          <span class="resumen-hoy-inicio__etiqueta">Ventas de hoy</span>
          <span class="resumen-hoy-inicio__valor" id="resumen-ventas-hoy">Q 0.00</span>
        </div>
        <div class="resumen-hoy-inicio__item">
          <span class="resumen-hoy-inicio__etiqueta">Fecha</span>
          <span class="resumen-hoy-inicio__valor" id="resumen-fecha-hoy">—</span>
        </div>
      </div>
      <p class="inicio-version" id="inicio-version"></p>
    </main>
  </div>

  <script src="../js/sha256.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/inicio.js"></script>
  <script src="../js/aviso-respaldo.js"></script>
  <script src="../js/registrar-sw.js"></script>
</body>
</html>
